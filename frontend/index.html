<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Foxy Jumpscare</title>
    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        overflow: hidden;
        background: transparent;
        cursor: none;
      }

      #jumpscare {
        width: 100%;
        height: 100%;
        object-fit: contain;
        opacity: 0;
        transition: opacity 60ms linear;
        pointer-events: none;
        user-select: none;
        -webkit-user-drag: none;
      }
    </style>
  </head>
  <body>
    <canvas id="jumpscare"></canvas>
    <script type="module" src="./main.js"></script>
  </body>
</html>
